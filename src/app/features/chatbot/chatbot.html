<div class="chat-container">
    <div class="chat-header">
        <h2>AI Assistant</h2>
    </div>
    <div class="chat-messages">
        @for (msg of messages; track $index) {
        <div class="message {{ msg.sender }}">
            {{ msg.text }}
        </div>
        }

        @if (botIsTyping) {
        <div class="message bot typing">
            typing...
        </div>
        }
    </div>

    <div class="chat-input"><button class="mic-btn">🎤</button>
        <input [(ngModel)]="messageText" (keydown.enter)="sendUserMessage()" placeholder="Type your message..." />
        <button class="send-btn" (click)="sendUserMessage()"> Send </button>
    </div>
</div>
